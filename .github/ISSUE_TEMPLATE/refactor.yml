name: ♻️ 重构任务
description: 不改变外部行为的代码结构或架构调整
title: "[Refactor] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 当前问题
      description: 现有实现存在哪些复杂度、耦合、可维护性或扩展性问题？
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: 重构目标
      description: 本次重构希望改善什么？
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 影响范围
      description: 涉及哪些模块、接口或目录？

  - type: textarea
    id: constraints
    attributes:
      label: 约束
      description: 需要保持哪些行为、兼容性或性能指标不变？
      placeholder: |
        - 对外接口保持不变
        - 现有测试必须通过
        - 不引入新的运行时依赖

  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      placeholder: |
        - [ ] 目标模块完成拆分
        - [ ] 现有测试通过
        - [ ] 无外部行为变化
    validations:
      required: true
